services:
  inventory-api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_CONFIG_FILE: /run/secrets/mysql.local.yaml
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 backend/.env 中设置至少16字符的管理员口令}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://sz-labs.github.io}
    volumes:
      - ../mysql.local.yaml:/run/secrets/mysql.local.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?请在 backend/.env 中填写已指向服务器的API域名}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      inventory-api:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
